name: Build and Release SEA Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build and upload for (e.g., v0.1.1)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: darwin
            arch: x64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: win32
            arch: x64
            runner: windows-latest
    env:
      TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.event.inputs.tag }}
    steps:
      - name: Checkout code at tag (or current SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA binary
        run: npm run build:sea:current

      - name: Rename and checksum (Linux)
        if: matrix.os == 'linux'
        run: |
          mv dist/sea/openskills dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}
          sha256sum dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }} > dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}.sha256
          ls -lh dist/sea/openskills-*
          file dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}
          echo "✅ Binary created successfully"

      - name: Rename and checksum (macOS)
        if: matrix.os == 'darwin'
        run: |
          mv dist/sea/openskills dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}
          shasum -a 256 dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }} > dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}.sha256
          ls -lh dist/sea/openskills-*
          file dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}
          echo "✅ Binary created successfully"

      - name: Rename and checksum (Windows)
        if: matrix.os == 'win32'
        shell: bash
        run: |
          mv dist/sea/openskills.exe dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}.exe
          certutil -hashfile dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}.exe SHA256 > dist/sea/openskills-${{ matrix.os }}-${{ matrix.arch }}.sha256
          ls -lh dist/sea/openskills-*
          echo "✅ Binary created successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openskills-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/sea/*
          retention-days: 5

  release:
    name: Create/Update GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    env:
      TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.event.inputs.tag }}
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Display structure
        run: ls -R binaries

      - name: Prepare release files
        run: |
          mkdir -p release
          find binaries -type f -exec mv {} release/ \;
          ls -lh release/

      - name: Create or update GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 📊 openskills ${{ env.TAG_NAME }}

            Single executable binaries for all platforms (no Node.js required!)

            ### Installation

            **Manual download:**
            - **Linux x64**: `openskills-linux-x64`
            - **macOS Intel**: `openskills-darwin-x64`
            - **macOS Apple Silicon**: `openskills-darwin-arm64`
            - **Windows**: `openskills-win32-x64.exe`

            SHA256 checksums are provided for each binary.

            ### For Contributors
            ```bash
            npm install -g openskills
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
